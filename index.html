<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LifeKompas — offline personal organizer: obligations, shopping, finances, health, diary and more.">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
  <title>LifeKompas</title>
  <style>
    :root {
      --bg: #1e3d52;
      --bg-deep: #173445;
      --bg-elevated: rgba(255, 255, 255, 0.08);
      --bg-card: rgba(255, 255, 255, 0.09);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f4f8fc;
      --muted: #b8c9d8;
      --accent: #45a068;
      --accent-light: #8fd4a8;
      --accent-soft: rgba(69, 160, 104, 0.22);
      --radius: 18px;
      --shadow: 0 12px 36px rgba(12, 40, 58, 0.28);
      --header-h: 58px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      overflow-x: clip;
    }

    body {
      margin: 0;
      overflow-x: clip;
      max-width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      line-height: 1.55;
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(ellipse 110% 70% at 50% -15%, rgba(120, 190, 230, 0.28), transparent 52%),
        radial-gradient(ellipse 85% 55% at 95% 85%, rgba(69, 160, 104, 0.22), transparent 48%),
        radial-gradient(ellipse 70% 45% at 5% 95%, rgba(80, 150, 120, 0.16), transparent 42%),
        linear-gradient(180deg, #255570 0%, #1e4558 38%, #1a3d50 100%);
      background-attachment: fixed;
    }

    a { color: var(--accent-light); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 200;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(23, 52, 69, 0.78);
      border-bottom: 1px solid var(--border);
    }

    .site-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: var(--header-h);
    }

    .site-logo {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }

    .site-logo:hover { text-decoration: none; opacity: 0.9; }

    .lang-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .lang-picker button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .lang-picker button:hover {
      color: var(--text);
      border-color: rgba(61, 143, 90, 0.45);
    }

    .lang-picker button.is-active {
      background: var(--accent-soft);
      border-color: rgba(61, 143, 90, 0.55);
      color: #b8e6c8;
      font-weight: 600;
    }

    .hero-banner {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .hero-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("assets/hero-bg.jpg") center 30% / cover no-repeat;
      transform: scale(1.06);
      filter: blur(1px);
    }

    .hero-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, rgba(100, 190, 140, 0.2), transparent 60%),
        linear-gradient(180deg, rgba(20, 50, 68, 0.45) 0%, rgba(26, 61, 80, 0.72) 55%, rgba(26, 61, 80, 0) 100%);
    }

    .hero-layout {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 20px 64px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: center;
    }

    @media (min-width: 860px) {
      .hero-layout {
        grid-template-columns: 1.05fr 0.95fr;
        padding: 72px 20px 80px;
      }
    }

    .hero-copy { text-align: center; }

    @media (min-width: 860px) {
      .hero-copy { text-align: left; }
    }

    .hero-copy h1 {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      margin: 0 0 16px;
      letter-spacing: -0.03em;
      line-height: 1.08;
    }

    .hero-copy .tagline {
      font-size: clamp(1.05rem, 2.5vw, 1.2rem);
      color: #c8d3e0;
      max-width: 34rem;
      margin: 0 auto;
    }

    @media (min-width: 860px) {
      .hero-copy .tagline { margin: 0; }
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }

    @media (min-width: 860px) {
      .hero-actions { justify-content: flex-start; }
    }

    .hero .pill {
      display: inline-block;
      margin-top: 18px;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(61, 143, 90, 0.35);
      color: #b8e6c8;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .hero-store-soon {
      margin: 14px 0 0;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }

    @media (min-width: 860px) {
      .hero-store-soon { text-align: left; }
    }

    .hero-guide-link {
      display: inline-flex;
      align-items: center;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .hero-guide-link:hover {
      text-decoration: none;
      border-color: rgba(61, 143, 90, 0.45);
      background: rgba(61, 143, 90, 0.12);
    }

    @media (max-width: 859px) {
      .hero-guide-link { display: none; }
    }

    .hero-phone {
      justify-self: center;
      width: min(100%, 260px);
      filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.45));
    }

    .hero-phone .phone-shell {
      padding: 12px 12px 0;
      background: linear-gradient(165deg, #3a4658 0%, #1e2836 100%);
      border-radius: 34px 34px 0 0;
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-bottom: none;
    }

    .hero-phone .phone-notch {
      width: 38%;
      height: 5px;
      margin: 0 auto 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    .hero-phone img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 22px 22px 0 0;
    }

    .hero-copy,
    .hero-phone {
      animation: heroIn 0.65s ease both;
      animation-delay: 0.1s;
    }

    @media (max-width: 859px) {
      .hero-layout {
        padding: 32px 16px 36px;
        gap: 20px;
      }

      .hero-copy h1 {
        font-size: clamp(1.85rem, 8vw, 2.4rem);
        margin-bottom: 12px;
      }

      .hero-copy .tagline {
        font-size: 1rem;
      }

      .hero-actions {
        margin-top: 16px;
      }

      .hero-phone {
        width: min(100%, 190px);
        filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.38));
      }

      section {
        margin-top: 40px;
      }

      .section-head .sub {
        margin-bottom: 20px;
      }

      .wrap {
        padding-bottom: 48px;
      }

      footer {
        margin-top: 48px;
        padding: 24px 18px;
      }
    }

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 8px 20px 72px;
      position: relative;
      overflow-x: clip;
    }

    .wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 28px 28px 0 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, transparent 120px);
      pointer-events: none;
    }

    section {
      margin-top: 56px;
      position: relative;
    }

    .section-head h2 {
      font-size: clamp(1.35rem, 3vw, 1.65rem);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
      color: #f8fbfe;
    }

    .section-head .sub {
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 0.96rem;
      max-width: 42rem;
    }

    .video-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
    }

    .video-swipe-hint {
      display: none;
      margin: 0 0 14px;
      font-size: 0.88rem;
      color: var(--muted);
      text-align: center;
    }

    .video-slot {
      aspect-ratio: 16 / 9;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-card);
      overflow: hidden;
      cursor: zoom-in;
    }

    .video-slot.has-video {
      flex: 0 1 280px;
      width: 100%;
      max-width: 280px;
      background: linear-gradient(165deg, #4a6278 0%, #334958 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .video-slot-player {
      aspect-ratio: 331 / 720;
      width: 100%;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .video-slot iframe,
    .video-slot video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      object-fit: contain;
      background: transparent;
    }

    .video-slot-caption {
      display: block;
      padding: 12px 12px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      text-align: center;
      background: rgba(26, 61, 80, 0.72);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    /* DE promo — zasebna sekcija iznad Anleitungen */
    .de-promo-section {
      margin-bottom: 8px;
    }

    .de-promo-player-wrap {
      display: flex;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .de-promo-player {
      width: min(100%, 340px);
      border-radius: calc(var(--radius) + 4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(165deg, #4a6278 0%, #334958 100%);
      box-shadow: 0 16px 42px rgba(8, 28, 42, 0.38);
      overflow: hidden;
      cursor: zoom-in;
    }

    .de-promo-player.has-video {
      display: flex;
      flex-direction: column;
    }

    .de-promo-player video {
      display: block;
      width: 100%;
      aspect-ratio: 607 / 1080;
      object-fit: contain;
      background: #000;
      border: 0;
    }

    .de-promo-player-caption {
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      color: var(--text);
      background: rgba(26, 61, 80, 0.82);
      border-top: 1px solid var(--border);
    }

    .de-promo-store {
      margin: 0;
      text-align: center;
      font-size: 0.92rem;
      color: var(--accent-light);
      font-weight: 600;
    }

    @media (min-width: 900px) {
      .de-promo-player {
        width: min(100%, 380px);
      }
    }

    @media (max-width: 899px) {
      .video-swipe-hint {
        display: block;
      }

      .video-scroll {
        overflow-x: auto;
        overscroll-behavior-x: none;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x mandatory;
        max-width: 100%;
        margin: 0;
        padding: 2px 0 14px;
      }

      .video-grid {
        display: flex;
        flex-wrap: nowrap;
        align-items: stretch;
        justify-content: flex-start;
        gap: 14px;
        width: max-content;
        padding: 0 14px;
        padding-inline-end: max(14px, calc(100% - min(68vw, 220px)));
      }

      .video-slot.has-video {
        flex: 0 0 min(68vw, 220px);
        width: min(68vw, 220px);
        max-width: none;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }

      .video-slot.has-video video,
      .video-slot.has-video iframe {
        min-height: 0;
      }
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(120, 180, 150, 0.06));
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.94rem;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .feature:hover {
      transform: translateY(-2px);
      border-color: rgba(143, 212, 168, 0.45);
      box-shadow: 0 10px 28px rgba(12, 40, 58, 0.22);
    }

    .feature-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: var(--accent-soft);
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .guide-card {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.11), rgba(100, 170, 140, 0.07));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius);
      padding: 28px 28px 22px;
      box-shadow: var(--shadow);
    }

    .guide-list {
      margin: 0;
      padding-left: 1.15em;
      color: var(--text);
    }

    .guide-list li {
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .guide-list li:last-child { margin-bottom: 0; }

    .guide-footnote {
      margin: 22px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .guide-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin: 0;
      padding: 14px 18px;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.11), rgba(100, 170, 140, 0.07));
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      font-family: inherit;
      line-height: inherit;
      cursor: pointer;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }

    .guide-toggle::after {
      content: "▾";
      color: var(--accent-light);
      font-size: 1.1rem;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .guide-toggle.is-open {
      margin-bottom: 14px;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .guide-toggle.is-open::after {
      transform: rotate(180deg);
    }

    .guide-details .guide-card {
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }

    @media (max-width: 899px) {
      #guide.guide-section--mobile-collapsed .section-head {
        display: none;
      }

      #guide-panel[hidden] {
        display: none !important;
      }
    }

    @media (min-width: 900px) {
      .guide-toggle { display: none !important; }

      #guide-panel,
      #guide-panel[hidden] {
        display: block !important;
      }

      .guide-details .guide-card {
        border-radius: var(--radius);
      }
    }

    .gallery-hint {
      display: none;
      margin: 0 0 14px;
      font-size: 0.88rem;
      color: var(--muted);
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 28px;
      justify-items: center;
    }

    @media (min-width: 900px) {
      .gallery {
        grid-template-columns: repeat(4, 220px);
        justify-content: center;
      }
    }

    @media (max-width: 899px) {
      .gallery-hint {
        display: block;
      }

      #modules {
        display: none;
      }

      .gallery-scroll {
        overflow-x: auto;
        overscroll-behavior-x: none;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x mandatory;
        max-width: 100%;
        margin: 0;
        padding: 2px 0 14px;
      }

      .gallery {
        display: flex;
        flex-wrap: nowrap;
        align-items: stretch;
        gap: 14px;
        overflow: visible;
        padding: 0 14px;
        padding-inline-end: max(14px, calc(100% - min(68vw, 188px)));
        margin: 0;
        justify-content: flex-start;
        width: max-content;
        box-sizing: border-box;
      }

      .gallery .shot {
        flex: 0 0 min(68vw, 188px);
        max-width: none;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }

      .features {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .feature {
        padding: 12px 12px;
        font-size: 0.86rem;
        gap: 10px;
      }

      .feature-icon {
        width: 36px;
        height: 36px;
        font-size: 1.05rem;
        border-radius: 10px;
      }
    }

    .shot {
      width: 100%;
      max-width: 220px;
      background: linear-gradient(165deg, #4a6278 0%, #334958 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: zoom-in;
    }

    .shot:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(12, 40, 58, 0.32);
    }

    .phone-frame {
      padding: 10px 10px 0;
    }

    .phone-frame::before {
      content: "";
      display: block;
      width: 36%;
      height: 4px;
      margin: 0 auto 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
    }

    .phone-frame img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px 18px 0 0;
      cursor: zoom-in;
    }

    .shot figcaption {
      padding: 12px 14px 14px;
      font-size: 0.82rem;
      color: var(--muted);
      background: rgba(26, 61, 80, 0.35);
    }

    .shot figcaption strong {
      display: block;
      color: var(--text);
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    footer {
      margin-top: 72px;
      padding: 32px 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.1), rgba(90, 160, 130, 0.08));
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      box-shadow: var(--shadow);
    }

    footer nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px 28px;
      margin-bottom: 16px;
    }

    footer nav a { font-weight: 600; }

    footer .contact { margin-top: 12px; }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: none;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background: rgba(5, 10, 18, 0.92);
      backdrop-filter: blur(8px);
      touch-action: manipulation;
    }

    .lightbox[hidden] { display: none; }

    .lightbox-panel {
      position: relative;
      z-index: 1001;
      max-width: min(420px, 100%);
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .lightbox-panel .lightbox-media,
    .lightbox-panel .lightbox-caption {
      pointer-events: auto;
    }

    .lightbox-panel.is-video {
      max-width: min(960px, 100%);
      width: 100%;
    }

    .lightbox-media {
      max-height: calc(100vh - 120px);
      overflow: auto;
      border-radius: 16px;
      box-shadow: 0 16px 56px rgba(0, 0, 0, 0.55);
    }

    .lightbox-media img {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 120px);
      object-fit: contain;
      border-radius: 16px;
    }

    .lightbox-media iframe {
      display: block;
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 12px;
      background: #000;
    }

    .lightbox-media video {
      display: block;
      width: auto;
      max-width: min(420px, 100%);
      max-height: calc(100vh - 120px);
      border: 0;
      border-radius: 12px;
      background: #000;
    }

    .lightbox-caption {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: fixed;
      z-index: 1010;
      border: 1px solid var(--border);
      background: rgba(15, 23, 36, 0.92);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;

      height: 48px;
      font-size: 1.75rem;

      left: 0;
      right: 0;
      bottom: 0;

      justify-content: center;

      color: var(--text);

      cursor: pointer;

      color: var(--muted);

      .lightbox-panel {
        max-height: calc(100vh - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      }

      .lightbox-media {
        max-height: calc(100vh - 160px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));

      function detectLang() {
        var saved = localStorage.getItem(LANG_KEY);
        if (saved && LANGS.indexOf(saved) !== -1) return saved;
        var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
        if (LANGS.indexOf(nav) !== -1) return nav;
        return 'en';
      }

      function t(key) {
        return PACK[currentLang][key];
      }

      function shotPath(file) {
        return 'assets/screenshots/' + currentLang + '/' + file;
      }

      function applyTexts() {
        var pack = PACK[currentLang];
        document.documentElement.lang = currentLang;
        document.querySelector('meta[name="description"]').setAttribute('content', pack.metaDescription);
        lightbox.setAttribute('aria-label', pack.lightboxDialog);

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var key = el.getAttribute('data-i18n');
          if (pack[key] != null) el.textContent = pack[key];
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
          var key = el.getAttribute('data-i18n-placeholder');
          if (pack[key] != null) el.setAttribute('placeholder', pack[key]);
        });

        document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
          var key = el.getAttribute('data-i18n-aria');
          if (pack[key] != null) el.setAttribute('aria-label', pack[key]);
        });


        var notifyLink = document.getElementById('notify-mail-link');
        if (notifyLink && pack.notifyMailSubject) {
          notifyLink.href = 'mailto:lifekompas1@gmail.com?subject=' + encodeURIComponent(pack.notifyMailSubject);
        }

        document.getElementById('link-privacy').href = pack.privacyHref;
        document.getElementById('link-terms').href = pack.termsHref;

        document.querySelectorAll('.lang-picker button').forEach(function (btn) {
          btn.classList.toggle('is-active', btn.getAttribute('data-lang') === currentLang);
        });



        if (lbMobileClose && pack.lightboxCloseLabel) {
          lbMobileClose.textContent = pack.lightboxCloseLabel;
        }

        buildGuide();
        updateGuideSummaryLabel();
        updateHeroShot();
        buildDePromoSection();
        buildVideos();
      }

      function pausePageVideos() {
        document.querySelectorAll('video').forEach(function (v) {
          if (lightbox && lightbox.contains(v)) return;
          try {
            v.pause();
          } catch (err) { /* ignore */ }
        });
      }

      function bindVideoSlotLightbox(slot, label) {
        if (!slot) return;
        var iframe = slot.querySelector('iframe');
        var video = slot.querySelector('video');
        if (!iframe && !video) return;
        var pack = PACK[currentLang];
        var itemIndex = lightboxItems.length;
        var item = { type: 'video', label: label || 'Demo video' };
        if (iframe) {
          item.embedSrc = iframe.src;
        } else if (video) {
          var source = video.querySelector('source');
          item.videoSrc = source ? source.src : video.currentSrc || video.src;
          item.poster = video.poster || '';
        } else {
          return;
        }
        lightboxItems.push(item);
        slot.setAttribute('role', 'button');
        slot.setAttribute('tabindex', '0');
        slot.setAttribute('aria-label', pack.enlarge + ': ' + (label || 'Demo video'));

        function openFromSlot(e) {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          pausePageVideos();
          openLightbox(itemIndex);
        }

        slot.onclick = openFromSlot;
        slot.onkeydown = function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openFromSlot(e);
          }
        };
        // Klik na video (poster/play) ne smije pustiti zvuk na stranici + u lightboxu.
        if (video) {
          video.addEventListener('click', openFromSlot, true);
          video.addEventListener('play', function () {
            if (lightbox && !lightbox.hidden) {
              try { video.pause(); } catch (err) { /* ignore */ }
            }
          });
        }
      }

      function buildDePromoSection() {
        if (!dePromoSection || !dePromoSlot) return;
        dePromoSlot.innerHTML = '';
        dePromoSlot.classList.remove('has-video');
        dePromoSlot.removeAttribute('role');
        dePromoSlot.removeAttribute('tabindex');
        dePromoSlot.removeAttribute('aria-label');
        dePromoSlot.onclick = null;
        dePromoSlot.onkeydown = null;

        var promo = PROMO_VIDEO[currentLang];
        if (!promo || !promo.file) {
          dePromoSection.hidden = true;
          return;
        }

        var pack = PACK[currentLang];
        dePromoSection.hidden = false;

        var video = document.createElement('video');
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('aria-label', pack[promo.labelKey] || pack.videoPromo || 'Promo');
        if (promo.poster) video.poster = promo.poster;

        var source = document.createElement('source');
        source.src = 'assets/videos/' + promo.file;
        source.type = 'video/mp4';
        video.appendChild(source);

        var caption = document.createElement('span');
        caption.className = 'de-promo-player-caption';
        caption.textContent = pack[promo.labelKey] || pack.videoPromo || 'LifeKompas';

        dePromoSlot.appendChild(video);
        dePromoSlot.appendChild(caption);
        dePromoSlot.classList.add('has-video');
      }

      function updateHeroShot() {
        if (!heroShotEl) return;
        var pack = PACK[currentLang];
        heroShotEl.src = shotPath('02-home.png');
        heroShotEl.alt = pack.shot02.alt;
      }

      function syncVideoSection() {
        var hasContent = false;
        document.querySelectorAll('.video-slot').forEach(function (slot) {
          var media = slot.querySelector('iframe, video');
          slot.classList.toggle('has-video', !!media);
          slot.hidden = !media;
          if (media) hasContent = true;
        });
        if (videosSection) videosSection.hidden = !hasContent;
      }

      function buildVideos() {
        var pack = PACK[currentLang];
        var entries = VIDEOS[currentLang] || VIDEOS.en || [];
        var slots = [
          document.getElementById('video-slot-1'),
          document.getElementById('video-slot-2'),
          document.getElementById('video-slot-3')
        ];

        slots.forEach(function (slot, index) {
          if (!slot) return;
          slot.innerHTML = '';
          slot.classList.remove('has-video');
          slot.hidden = true;
          slot.removeAttribute('role');
          slot.removeAttribute('tabindex');
          slot.removeAttribute('aria-label');
          slot.onclick = null;
          slot.onkeydown = null;

          var entry = entries[index];
          if (!entry || !entry.file) return;

          var video = document.createElement('video');
          video.controls = true;
          video.playsInline = true;
          video.preload = 'metadata';
          video.setAttribute('playsinline', '');
          video.setAttribute('webkit-playsinline', '');
          video.setAttribute('aria-label', pack[entry.labelKey] || 'Demo video');
          if (entry.poster) video.poster = entry.poster;

          var source = document.createElement('source');
          source.src = 'assets/videos/' + entry.file;
          source.type = 'video/mp4';
          video.appendChild(source);

          var player = document.createElement('div');
          player.className = 'video-slot-player';
          player.appendChild(video);

          var label = document.createElement('span');
          label.className = 'placeholder-label';
          label.hidden = true;
          label.textContent = pack[entry.labelKey] || 'Demo video';

          var caption = document.createElement('span');
          caption.className = 'video-slot-caption';
          caption.textContent = pack[entry.labelKey] || 'Demo video';

          slot.appendChild(caption);
          slot.appendChild(player);
          slot.appendChild(label);
          slot.hidden = false;
        });

        syncVideoSection();
      }

      function buildGuide() {
        var pack = PACK[currentLang];
        guideListEl.innerHTML = '';
        (pack.guideSteps || []).forEach(function (step) {
          var li = document.createElement('li');
          li.textContent = step;
          guideListEl.appendChild(li);
        });
        guideFootnoteEl.textContent = pack.guideFootnote || '';
      }

      function updateGuideSummaryLabel() {
        if (!guideToggleEl) return;
        if (isDesktopGuideLayout()) return;
        var pack = PACK[currentLang];
        var isOpen = guidePanelEl && !guidePanelEl.hidden;
        guideToggleEl.textContent = isOpen
          ? (pack.guideCollapse || 'Close quick guide')
          : (pack.guideExpand || 'Open quick guide');
      }

      function setGuidePanelOpen(open) {
        if (!guidePanelEl || !guideToggleEl) return;
        guidePanelEl.hidden = !open;
        guideToggleEl.setAttribute('aria-expanded', open ? 'true' : 'false');
        guideToggleEl.classList.toggle('is-open', open);
        if (guideSectionEl && !isDesktopGuideLayout()) {
          guideSectionEl.classList.toggle('guide-section--mobile-collapsed', !open);
        }
        updateGuideSummaryLabel();
      }

      function clampGalleryScroll() {
        var scroller = document.querySelector('.gallery-scroll');
        if (!scroller || window.matchMedia('(min-width: 900px)').matches) return;
        var max = Math.max(0, scroller.scrollWidth - scroller.clientWidth);
        if (scroller.scrollLeft > max) scroller.scrollLeft = max;
        if (scroller.scrollLeft < 0) scroller.scrollLeft = 0;
      }

      function bindGalleryScrollClamp() {
        var scroller = document.querySelector('.gallery-scroll');
        if (!scroller || scroller.dataset.clampBound === '1') return;
        scroller.dataset.clampBound = '1';
        scroller.addEventListener('scroll', clampGalleryScroll, { passive: true });
        scroller.addEventListener('scrollend', clampGalleryScroll, { passive: true });
      }

      function buildGallery() {
        var pack = PACK[currentLang];
        galleryEl.innerHTML = '';
        lightboxItems = [];

        SHOTS.forEach(function (shot, i) {
          var meta = pack[shot.key];
          var fig = document.createElement('figure');
          fig.className = 'shot';

          var frame = document.createElement('div');
          frame.className = 'phone-frame';

          var img = document.createElement('img');
          img.src = shotPath(shot.file);
          img.alt = meta.alt;
          img.loading = 'eager';
          img.decoding = 'async';
          img.width = 390;
          img.height = 844;

          var cap = document.createElement('figcaption');
          var strong = document.createElement('strong');
          strong.textContent = meta.title;
          cap.appendChild(strong);
          cap.appendChild(document.createTextNode(meta.desc));

          frame.appendChild(img);
          fig.appendChild(frame);
          fig.appendChild(cap);
          galleryEl.appendChild(fig);

          lightboxItems.push({
            type: 'image',
            src: shotPath(shot.file),
            alt: meta.alt,
            label: meta.title
          });

          fig.setAttribute('role', 'button');
          fig.setAttribute('tabindex', '0');
          fig.setAttribute('aria-label', pack.enlarge + ': ' + meta.alt);
          fig.addEventListener('click', function () { openLightbox(i); });
          fig.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openLightbox(i);
            }
          });
        });
        clampGalleryScroll();
      }

      function imageLightboxIndices() {
        var indices = [];
        lightboxItems.forEach(function (item, idx) {
          if (item.type === 'image') indices.push(idx);
        });
        return indices;
      }

      function appendVideoLightboxItems() {
        document.querySelectorAll('.video-slot.has-video').forEach(function (slot) {
          var labelEl = slot.querySelector('.placeholder-label, .video-slot-caption');
          bindVideoSlotLightbox(slot, labelEl ? labelEl.textContent : 'Demo video');
        });
        if (dePromoSlot && dePromoSlot.classList.contains('has-video')) {
          var promoLabelEl = dePromoSlot.querySelector('.de-promo-player-caption');
          bindVideoSlotLightbox(
            dePromoSlot,
            promoLabelEl ? promoLabelEl.textContent : (PACK[currentLang].videoPromo || 'Promo')
          );
        }
      }

      function setLang(lang) {
        if (LANGS.indexOf(lang) === -1) return;
        currentLang = lang;
        localStorage.setItem(LANG_KEY, lang);
        applyTexts();
        buildGallery();
        appendVideoLightboxItems();
        // Ne skrolaj na promo — hero mora ostati prvi dojam pri otvaranju / promjeni jezika.
      }

      function renderLightbox() {
        var item = lightboxItems[lightboxIndex];
        media.innerHTML = '';
        caption.textContent = item.label || '';
        panel.classList.toggle('is-video', item.type === 'video');

        if (item.type === 'image') {
          var img = document.createElement('img');
          img.src = item.src;
          img.alt = item.alt;
          media.appendChild(img);
        } else if (item.embedSrc) {
          var frame = document.createElement('iframe');
          frame.src = item.embedSrc;
          frame.title = item.label || 'Video';
          frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
          frame.allowFullscreen = true;
          media.appendChild(frame);
        } else if (item.videoSrc) {
          var vid = document.createElement('video');
          vid.controls = true;
          vid.autoplay = true;
          if (item.poster) vid.poster = item.poster;
          var src = document.createElement('source');
          src.src = item.videoSrc;
          src.type = 'video/mp4';
          vid.appendChild(src);
          media.appendChild(vid);
        }

        var imageIndices = imageLightboxIndices();
        var showNav = item.type === 'image' && imageIndices.length > 1;
        btnPrev.hidden = !showNav;
        btnNext.hidden = !showNav;
        if (lbMobilePrev) lbMobilePrev.hidden = !showNav;
        if (lbMobileNext) lbMobileNext.hidden = !showNav;
        media.classList.toggle('is-navigable', showNav);
        media.onclick = null;
        if (showNav) {
          var imagePos = imageIndices.indexOf(lightboxIndex) + 1;
          caption.textContent = (item.label || '') + ' · ' + imagePos + ' / ' + imageIndices.length;
          if (lbMobileCounter) lbMobileCounter.textContent = imagePos + ' / ' + imageIndices.length;
          media.onclick = function (e) {
            if (e.target.closest('video, iframe')) return;
            var rect = media.getBoundingClientRect();
            var ratio = (e.clientX - rect.left) / rect.width;
            if (ratio <= 0.34) {
              e.stopPropagation();
              stepLightbox(-1);
            } else if (ratio >= 0.66) {
              e.stopPropagation();
              stepLightbox(1);
            }
          };
        } else {
          caption.textContent = item.label || '';
          if (lbMobileCounter) lbMobileCounter.textContent = '';
        }
      }

      function openLightbox(i) {
        if (!lightboxItems.length) return;
        pausePageVideos();
        lightboxIndex = i;
        renderLightbox();
        lightbox.hidden = false;
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        btnClose.focus();
        // Još jednom nakon rendera — native play s istog klika može kasniti.
        requestAnimationFrame(pausePageVideos);
        setTimeout(pausePageVideos, 0);
        setTimeout(pausePageVideos, 100);
      }

      function closeLightbox() {
        pausePageVideos();
        lightbox.hidden = true;
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        media.innerHTML = '';
      }

      function stepLightbox(delta) {
        var imageIndices = imageLightboxIndices();
        if (!imageIndices.length) return;
        var pos = imageIndices.indexOf(lightboxIndex);
        if (pos === -1) {
          lightboxIndex = imageIndices[0];
        } else {
          var nextPos = (pos + delta + imageIndices.length) % imageIndices.length;
          lightboxIndex = imageIndices[nextPos];
        }
        renderLightbox();
      }

      document.querySelectorAll('.lang-picker button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setLang(btn.getAttribute('data-lang'));
        });
      });

      btnClose.addEventListener('click', closeLightbox);
      btnPrev.addEventListener('click', function () { stepLightbox(-1); });
      btnNext.addEventListener('click', function () { stepLightbox(1); });
      if (lbMobileClose) lbMobileClose.addEventListener('click', closeLightbox);
      if (lbMobilePrev) lbMobilePrev.addEventListener('click', function () { stepLightbox(-1); });
      if (lbMobileNext) lbMobileNext.addEventListener('click', function () { stepLightbox(1); });
      lightbox.addEventListener('click', function (e) {
        if (e.target !== lightbox) return;
        if (!btnPrev.hidden) {
          var ratio = e.clientX / window.innerWidth;
          if (ratio <= 0.22) {
            stepLightbox(-1);
            return;
          }
          if (ratio >= 0.78) {
            stepLightbox(1);
            return;
          }
        }
        closeLightbox();
      });
      lightbox.addEventListener('pointerdown', function (e) {
        if (lightbox.hidden || btnPrev.hidden) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (e.target.closest('button, video, iframe, .lightbox-close, .lightbox-mobile-bar')) return;
        lightboxDragStartX = e.clientX;
        lightboxDragStartY = e.clientY;
        lightboxDragActive = true;
      }, { passive: true });
      lightbox.addEventListener('pointerup', function (e) {
        if (!lightboxDragActive || lightbox.hidden || btnPrev.hidden) return;
        lightboxDragActive = false;
        var dx = e.clientX - lightboxDragStartX;
        var dy = e.clientY - lightboxDragStartY;
        if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
        if (dx < 0) stepLightbox(1);
        else stepLightbox(-1);
      }, { passive: true });
      lightbox.addEventListener('pointercancel', function () {
        lightboxDragActive = false;
      }, { passive: true });
      document.addEventListener('keydown', function (e) {
        if (lightbox.hidden) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft' && !btnPrev.hidden) stepLightbox(-1);
        if (e.key === 'ArrowRight' && !btnNext.hidden) stepLightbox(1);
      });

      function isDesktopGuideLayout() {
        return window.matchMedia('(min-width: 900px)').matches;
      }

      function syncGuideDetailsState() {
        if (!guidePanelEl) return;
        if (isDesktopGuideLayout()) {
          if (guideSectionEl) guideSectionEl.classList.remove('guide-section--mobile-collapsed');
          setGuidePanelOpen(true);
          return;
        }
        setGuidePanelOpen(location.hash === '#guide');
      }

      function initGuideDetails() {
        syncGuideDetailsState();
      }

      function openGuideFromHash() {
        syncGuideDetailsState();
      }

      if (guideToggleEl) {
        guideToggleEl.addEventListener('click', function () {
          setGuidePanelOpen(guidePanelEl.hidden);
        });
      }

      var heroGuideLink = document.querySelector('.hero-guide-link');
      if (heroGuideLink) {
        heroGuideLink.addEventListener('click', function () {
          setGuidePanelOpen(true);
        });
      }

      window.matchMedia('(min-width: 900px)').addEventListener('change', syncGuideDetailsState);
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) return;
        syncGuideDetailsState();
      });

      function initReveal() {
        var reveals = document.querySelectorAll('.reveal');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          reveals.forEach(function (el) { el.classList.add('is-visible'); });
          return;
        }
        if (!('IntersectionObserver' in window)) {
          reveals.forEach(function (el) { el.classList.add('is-visible'); });
          return;
        }
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.02, rootMargin: '0px 0px 8% 0px' });
        reveals.forEach(function (el) { observer.observe(el); });
      }

      setLang(detectLang());
      initGuideDetails();
      openGuideFromHash();
      bindGalleryScrollClamp();
      window.addEventListener('hashchange', openGuideFromHash);
      initReveal();
    })();
  </script>
